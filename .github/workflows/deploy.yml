name: Deploy Laravel to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: ⬢ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Build Vite Assets
        run: |
          npm ci
          npm run build

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/node_modules/**
            **/vendor/**
            .env
            .env.example
            tests/**
            phpunit.xml
            README.md
            *.md
            *.zip

      - name: ⚡ Run Migrations & Clear Cache on Host
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://wedora.rubiksacademy.live' }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET || 'wedora_sec_9f48a1c73e04b68e21908bf' }}
        run: |
          echo "Clearing LiteSpeed/PHP OPcache and Laravel view/route caches..."
          CACHE_RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" "$APP_URL/system-cache-clear.php?token=$DEPLOY_SECRET")
          echo "$CACHE_RESPONSE"

          echo "Triggering database migrations and artisan optimizations..."
          MIGRATE_RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" "$APP_URL/system/auto-deploy-migrate?token=$DEPLOY_SECRET")
          echo "$MIGRATE_RESPONSE"

